openapi: 3.1.0
info:
  title: blow-flow API
  version: 0.1.0
  description: Account and generation-operations API. Platform credits and user billing are intentionally absent.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /auth/captcha:
    get:
      operationId: getLoginCaptcha
      summary: Create a single-use image challenge for administrator login
      security: []
      responses:
        "200":
          description: Image challenge valid for ten minutes
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [id, image]
                properties:
                  id: { type: string }
                  image: { type: string, description: PNG data URL }
        "500": { $ref: "#/components/responses/InternalError" }
        "429":
          description: CAPTCHA generation rate limited
          headers:
            Retry-After: { schema: { type: string } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/admin/login:
    post:
      operationId: loginAdministrator
      summary: Authenticate the local bootstrap administrator with password and image CAPTCHA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, captchaId, captchaAnswer]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                captchaId: { type: string }
                captchaAnswer: { type: string, minLength: 4, maxLength: 4 }
      responses:
        "200":
          description: Short-lived administrator access token
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Seconds until token expiry }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /generation/tasks:
    post:
      operationId: createGenerationTask
      summary: Queue a Krea2 generation for a controlled owned project
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, model, prompt, width, height]
              properties:
                projectId: { type: string }
                nodeId: { type: string, maxLength: 200, description: Optional node identity used to fence the current result }
                referenceIds: { type: array, maxItems: 0, description: Krea2 currently does not accept reference assets, items: { type: string } }
                model: { type: string, enum: [runninghub/krea2] }
                prompt: { type: string, maxLength: 8000 }
                width: { type: integer, minimum: 64, maximum: 8192, multipleOf: 8 }
                height: { type: integer, minimum: 64, maximum: 8192, multipleOf: 8 }
      responses:
        "202":
          description: Durable task, including a replay of the same idempotent request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Idempotency key reused with different input }
        "429": { description: User or model queue is full; error code identifies the scope }
        "503": { description: Connection queue is full or generation dependencies are unavailable }
  /generation/tasks/{id}:
    get:
      operationId: getGenerationTask
      summary: Query an owned task or query as an authorized administrator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public task projection, without prompt, references, or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not authorized }
  /generation/tasks/{id}/cancel:
    post:
      operationId: cancelGenerationTask
      summary: Cancel an owned task before the worker claims it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canceled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not owned }
        "409": { description: Task has already been claimed }
  /generation/tasks/{id}/resume:
    post:
      operationId: resumeGenerationDelivery
      summary: Resume query or result saving for an owned task without resubmitting generation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task after resume request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not authorized }
  /generation/tasks/{id}/events:
    get:
      operationId: getGenerationTaskEvents
      summary: Read task events as JSON or subscribe to owner-only task SSE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          description: JSON event cursor; ignored for SSE, which sends the latest PostgreSQL snapshot on connect
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: JSON event history or a versioned task stream, selected by Accept
          content:
            application/json:
              schema:
                type: object
                required: [task, events]
                properties:
                  task: { $ref: "#/components/schemas/GenerationTask" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/GenerationEvent" }
            text/event-stream:
              schema: { type: string, description: 'SSE event task; id is the task version and data is GenerationTask JSON' }
        "404": { description: Task not found or not authorized }
        "503": { description: SSE stream capacity reached or generation service unavailable }
  /admin/generation/operations:
    get:
      operationId: getGenerationOperations
      summary: Read audited generation queue, worker, circuit, stage, and failure metrics as an administrator
      responses:
        "200":
          description: Aggregated operations view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationOperations" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me:
    get:
      operationId: getCurrentUser
      summary: Resolve the signed access token to its local user account
      responses:
        "200":
          description: Current local user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/users:
    get:
      operationId: listUsers
      summary: List local user accounts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/users/{userId}/disable:
    post:
      operationId: disableUser
      summary: Disable a user account and append an audit event
      description: Requires authentication no more than ten minutes old.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List immutable administrator audit events
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    GenerationTask:
      type: object
      required: [id, version, status, model, projectId, stage, createdAt, updatedAt]
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [queued, running, completed, canceled, failed, needs_review, query_failed, save_exhausted] }
        model: { type: string }
        projectId: { type: string }
        nodeId: { type: string }
        stage: { type: string }
        percent: { type: number, minimum: 0, maximum: 100, description: Omitted until overall progress is verified from provider events }
        failureCode: { type: string }
        resultUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GenerationEvent:
      type: object
      required: [id, type, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        stage: { type: string }
        occurredAt: { type: string, format: date-time }
    GenerationOperations:
      type: object
      required: [queueLength, oldestWaitSeconds, needsReview, stages, failures, workers, circuits]
      properties:
        queueLength: { type: integer, format: int64 }
        oldestWaitSeconds: { type: number }
        needsReview: { type: integer, format: int64 }
        stages:
          type: array
          items:
            type: object
            required: [stage, averageSeconds, samples]
            properties:
              stage: { type: string }
              averageSeconds: { type: number }
              samples: { type: integer, format: int64 }
        failures:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer, format: int64 }
        workers:
          type: array
          items:
            type: object
            required: [id, seenAt]
            properties:
              id: { type: string }
              seenAt: { type: string, format: date-time }
        circuits:
          type: array
          items:
            type: object
            required: [connectionId, operation, state, consecutiveFailures]
            properties:
              connectionId: { type: string }
              operation: { type: string, enum: [submit, query, save] }
              state: { type: string, enum: [closed, open, half_open] }
              consecutiveFailures: { type: integer }
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required: [id, email, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorId, action, targetType, targetId, metadata, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string }
        requestId: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Account, role, email verification, or recent authentication policy rejected the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Operation conflicts with an account safety invariant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Account dependencies are not configured or unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
