openapi: 3.1.0
info:
  title: blow-flow API
  version: 0.1.0
  description: Account and generation-operations API. Platform credits and user billing are intentionally absent.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /auth/captcha:
    get:
      operationId: getLoginCaptcha
      summary: Create a single-use image challenge for administrator login
      security: []
      responses:
        "200":
          description: Image challenge valid for ten minutes
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [id, image]
                properties:
                  id: { type: string }
                  image: { type: string, description: PNG data URL }
        "500": { $ref: "#/components/responses/InternalError" }
        "429":
          description: CAPTCHA generation rate limited
          headers:
            Retry-After: { schema: { type: string } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/admin/login:
    post:
      operationId: loginAdministrator
      summary: Authenticate the local bootstrap administrator with password and image CAPTCHA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, captchaId, captchaAnswer]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                captchaId: { type: string }
                captchaAnswer: { type: string, minLength: 4, maxLength: 4 }
      responses:
        "200":
          description: Short-lived administrator access token
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Seconds until token expiry }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/user/login:
    post:
      operationId: loginCreator
      summary: Authenticate a provisioned creator with password and image CAPTCHA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, captchaId, captchaAnswer]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                captchaId: { type: string }
                captchaAnswer: { type: string }
      responses:
        "200":
          description: Fifteen-minute creator bearer token and user
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /workspace:
    get:
      operationId: getOwnedWorkspace
      summary: List the current creator's projects and folders
      parameters:
        - name: trash
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Owned workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /projects:
    post:
      operationId: createOwnedProject
      summary: Create a project with an empty canvas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, maxLength: 200 }
                name: { type: string, maxLength: 200 }
                folderId: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { description: Project ID already exists }
  /projects/{id}:
    get:
      operationId: getOwnedProject
      summary: Read an active owned project and canvas snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { description: Project not found or owned by another user }
        "410": { description: Project is in the recycle bin }
    patch:
      operationId: changeOwnedProject
      summary: Rename, move, trash, restore, or purge an owned project with a version check
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, expectedVersion]
              properties:
                action: { type: string, enum: [rename, move, trash, restore, purge] }
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                name: { type: string }
                folderId: { type: string, nullable: true }
      responses:
        "200":
          description: Updated project or tombstone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { description: Version or state conflict }
  /projects/{id}/canvas:
    put:
      operationId: saveOwnedCanvas
      summary: Atomically save a complete canvas snapshot, version, and idempotency receipt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, baseVersion, snapshot]
              properties:
                requestId: { type: string, maxLength: 200 }
                baseVersion: { type: integer, format: int64, minimum: 1 }
                snapshot: { type: object, description: Complete name, nodes, edges, viewport, and optional history }
      responses:
        "200":
          description: Durable save receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasSaveReceipt" }
        "409": { description: Version conflict or request ID reused with different content }
        "410": { description: Project was trashed or purged }
  /projects/{id}/assets:
    post:
      operationId: uploadOwnedAsset
      summary: Upload a validated media file to an owned active project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Owned asset metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { description: Unsupported or oversized file }
        "404": { description: Project not found or not owned }
  /assets/{id}:
    get:
      operationId: getOwnedAsset
      summary: Read current user's asset metadata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "404": { description: Asset not found, not owned, or its project is deleted }
  /folders:
    post:
      operationId: createOwnedFolder
      summary: Create a folder in the current user's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
  /folders/{id}:
    patch:
      operationId: renameOwnedFolder
      summary: Rename an owned folder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Renamed folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
    delete:
      operationId: deleteOwnedFolder
      summary: Delete a folder while retaining its projects at workspace root
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Folder deleted }
  /script/models:
    get:
      operationId: listScriptModels
      summary: List configured server-side text models without credentials
      responses:
        "200":
          description: Available model capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        provider: { type: string, enum: [ark, gemini] }
                        vision: { type: boolean }
                        available: { type: boolean }
  /script/tasks:
    post:
      operationId: createScriptTask
      summary: Create an owned script task and its output node atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScriptCreate" }
      responses:
        "202":
          description: Queued task or idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptTask" }
        "409": { description: Active task, missing script node, or request identity conflict }
        "503": { description: Text model not configured }
    get:
      operationId: listScriptTasks
      summary: List the current user's script tasks for one project
      parameters:
        - { name: canvasId, in: query, required: true, schema: { type: string } }
        - { name: nodeId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tasks ordered newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScriptTask" } }
  /script/tasks/{id}:
    get:
      operationId: getScriptTask
      summary: Read an owned script task and its latest checkpoint
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Script task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptTask" }
        "404": { description: Task not found or owned by another user }
  /script/tasks/{id}/stop:
    post:
      operationId: stopScriptTask
      summary: Stop a queued or running owned script task
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Latest task state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptTask" }
  /script/tasks/{id}/events:
    get:
      operationId: streamScriptTask
      summary: Stream owned task revisions by SSE with PostgreSQL catchup
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: SSE task events with revision IDs }
  /script/events:
    get:
      operationId: streamProjectScriptTasks
      summary: Stream changed script tasks for an owned project
      parameters: [{ name: canvasId, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: SSE tasks events containing changed tasks }
  /generation/tasks:
    post:
      operationId: createGenerationTask
      summary: Queue a Krea2 generation for a controlled owned project
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, model, prompt, width, height]
              properties:
                projectId: { type: string }
                nodeId: { type: string, maxLength: 200, description: Optional node identity used to fence the current result }
                referenceIds: { type: array, maxItems: 0, description: Krea2 currently does not accept reference assets, items: { type: string } }
                model: { type: string, enum: [runninghub/krea2] }
                prompt: { type: string, maxLength: 8000 }
                width: { type: integer, minimum: 64, maximum: 8192, multipleOf: 8 }
                height: { type: integer, minimum: 64, maximum: 8192, multipleOf: 8 }
      responses:
        "202":
          description: Durable task, including a replay of the same idempotent request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Idempotency key reused with different input }
        "429": { description: User or model queue is full; error code identifies the scope }
        "503": { description: Connection queue is full or generation dependencies are unavailable }
  /generation/tasks/{id}:
    get:
      operationId: getGenerationTask
      summary: Query an owned task or query as an authorized administrator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public task projection, without prompt, references, or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not authorized }
  /generation/tasks/{id}/cancel:
    post:
      operationId: cancelGenerationTask
      summary: Cancel an owned task before the worker claims it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canceled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not owned }
        "409": { description: Task has already been claimed }
  /generation/tasks/{id}/resume:
    post:
      operationId: resumeGenerationDelivery
      summary: Resume query or result saving for an owned task without resubmitting generation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task after resume request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not authorized }
  /generation/tasks/{id}/events:
    get:
      operationId: getGenerationTaskEvents
      summary: Read task events as JSON or subscribe to owner-only task SSE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          description: JSON event cursor; ignored for SSE, which sends the latest PostgreSQL snapshot on connect
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: JSON event history or a versioned task stream, selected by Accept
          content:
            application/json:
              schema:
                type: object
                required: [task, events]
                properties:
                  task: { $ref: "#/components/schemas/GenerationTask" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/GenerationEvent" }
            text/event-stream:
              schema: { type: string, description: 'SSE event task; id is the task version and data is GenerationTask JSON' }
        "404": { description: Task not found or not authorized }
        "503": { description: SSE stream capacity reached or generation service unavailable }
  /admin/generation/operations:
    get:
      operationId: getGenerationOperations
      summary: Read audited generation queue, worker, circuit, stage, and failure metrics as an administrator
      responses:
        "200":
          description: Aggregated operations view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationOperations" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me:
    get:
      operationId: getCurrentUser
      summary: Resolve the signed access token to its local user account
      responses:
        "200":
          description: Current local user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/users:
    get:
      operationId: listUsers
      summary: List local user accounts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/users/{userId}/disable:
    post:
      operationId: disableUser
      summary: Disable a user account and append an audit event
      description: Requires authentication no more than ten minutes old.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List immutable administrator audit events
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    Workspace:
      type: object
      required: [projects, folders]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }
        folders:
          type: array
          items: { $ref: "#/components/schemas/Folder" }
    ProjectSummary:
      type: object
      required: [id, name, version, nodeCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        folderId: { type: string }
        version: { type: integer, format: int64 }
        coverUrl: { type: string }
        nodeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
    Project:
      allOf:
        - { $ref: "#/components/schemas/ProjectSummary" }
        - type: object
          required: [snapshot]
          properties:
            snapshot: { type: object }
            purgedAt: { type: string, format: date-time }
    Folder:
      type: object
      required: [id, name, projectCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        projectCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CanvasSaveReceipt:
      type: object
      required: [id, requestId, version]
      properties:
        id: { type: string }
        requestId: { type: string }
        version: { type: integer, format: int64 }
    MediaAsset:
      type: object
      required: [id, kind, url, sizeBytes, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string, enum: [image, video, audio] }
        url: { type: string }
        objectKey: { type: string }
        originalName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    ScriptCreate:
      type: object
      required: [requestId, canvasId, nodeId, input]
      properties:
        requestId: { type: string, maxLength: 200 }
        canvasId: { type: string, maxLength: 200 }
        nodeId: { type: string, maxLength: 200 }
        input:
          type: object
          required: [model, requirements, instruction, preset, references]
          properties:
            model: { type: string }
            requirements: { type: string }
            instruction: { type: string }
            preset: { type: string }
            outputMode: { type: string, enum: [board, workflow] }
            storyboard:
              type: object
              properties:
                duration: { type: integer, minimum: 5, maximum: 600 }
                maxShots: { type: integer, minimum: 1, maximum: 40 }
            references:
              type: array
              items:
                type: object
                required: [nodeId, label, type, content]
                properties:
                  nodeId: { type: string }
                  label: { type: string }
                  type: { type: string, enum: [text, image] }
                  content: { type: string }
    ScriptTask:
      type: object
      required: [id, requestId, canvasId, nodeId, input, status, phase, text, outputSaved, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string }
        canvasId: { type: string }
        nodeId: { type: string }
        input: { $ref: "#/components/schemas/ScriptCreate/properties/input" }
        status: { type: string, enum: [queued, running, stopping, stopped, completed, failed, interrupted] }
        phase: { type: string }
        text: { type: string }
        workflow: { type: object }
        outputNodeId: { type: string }
        outputSaved: { type: boolean }
        revision: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64, description: Unix milliseconds }
        updatedAt: { type: integer, format: int64, description: Unix milliseconds }
        error: { type: string }
    GenerationTask:
      type: object
      required: [id, version, status, model, projectId, stage, createdAt, updatedAt]
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [queued, running, completed, canceled, failed, needs_review, query_failed, save_exhausted] }
        model: { type: string }
        projectId: { type: string }
        nodeId: { type: string }
        stage: { type: string }
        percent: { type: number, minimum: 0, maximum: 100, description: Omitted until overall progress is verified from provider events }
        failureCode: { type: string }
        resultUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GenerationEvent:
      type: object
      required: [id, type, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        stage: { type: string }
        occurredAt: { type: string, format: date-time }
    GenerationOperations:
      type: object
      required: [queueLength, oldestWaitSeconds, needsReview, stages, failures, workers, circuits]
      properties:
        queueLength: { type: integer, format: int64 }
        oldestWaitSeconds: { type: number }
        needsReview: { type: integer, format: int64 }
        stages:
          type: array
          items:
            type: object
            required: [stage, averageSeconds, samples]
            properties:
              stage: { type: string }
              averageSeconds: { type: number }
              samples: { type: integer, format: int64 }
        failures:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer, format: int64 }
        workers:
          type: array
          items:
            type: object
            required: [id, seenAt]
            properties:
              id: { type: string }
              seenAt: { type: string, format: date-time }
        circuits:
          type: array
          items:
            type: object
            required: [connectionId, operation, state, consecutiveFailures]
            properties:
              connectionId: { type: string }
              operation: { type: string, enum: [submit, query, save] }
              state: { type: string, enum: [closed, open, half_open] }
              consecutiveFailures: { type: integer }
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required: [id, email, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorId, action, targetType, targetId, metadata, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string }
        requestId: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Account, role, email verification, or recent authentication policy rejected the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Operation conflicts with an account safety invariant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Account dependencies are not configured or unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
