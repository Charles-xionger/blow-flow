openapi: 3.1.0
info:
  title: blow-flow API
  version: 0.1.0
  description: Account and generation-operations API. Platform credits and user billing are intentionally absent.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /auth/captcha:
    get:
      operationId: getLoginCaptcha
      summary: Create a single-use image challenge for administrator login
      security: []
      responses:
        "200":
          description: Image challenge valid for ten minutes
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [id, image]
                properties:
                  id: { type: string }
                  image: { type: string, description: PNG data URL }
        "500": { $ref: "#/components/responses/InternalError" }
        "429":
          description: CAPTCHA generation rate limited
          headers:
            Retry-After: { schema: { type: string } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/admin/login:
    post:
      operationId: loginAdministrator
      summary: Authenticate the local bootstrap administrator with password and image CAPTCHA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, captchaId, captchaAnswer]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                captchaId: { type: string }
                captchaAnswer: { type: string, minLength: 4, maxLength: 4 }
      responses:
        "200":
          description: Short-lived administrator access token
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Seconds until token expiry }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /generation/tasks:
    post:
      operationId: createGenerationTask
      summary: Queue a Krea2 generation for a controlled owned project
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, model, prompt, width, height]
              properties:
                projectId: { type: string }
                referenceIds: { type: array, items: { type: string } }
                model: { type: string, enum: [runninghub/krea2] }
                prompt: { type: string, maxLength: 8000 }
                width: { type: integer, minimum: 256, maximum: 4096 }
                height: { type: integer, minimum: 256, maximum: 4096 }
      responses:
        "202":
          description: Durable task, including a replay of the same idempotent request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Idempotency key reused with different input }
  /generation/tasks/{id}:
    get:
      operationId: getGenerationTask
      summary: Query an owned task or query as an authorized administrator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public task projection, without prompt, references, or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not authorized }
  /generation/tasks/{id}/cancel:
    post:
      operationId: cancelGenerationTask
      summary: Cancel an owned task before the worker claims it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canceled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationTask" }
        "404": { description: Task not found or not owned }
        "409": { description: Task has already been claimed }
  /me:
    get:
      operationId: getCurrentUser
      summary: Resolve the signed access token to its local user account
      responses:
        "200":
          description: Current local user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/users:
    get:
      operationId: listUsers
      summary: List local user accounts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/users/{userId}/disable:
    post:
      operationId: disableUser
      summary: Disable a user account and append an audit event
      description: Requires authentication no more than ten minutes old.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List immutable administrator audit events
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    GenerationTask:
      type: object
      required: [id, status, model, projectId, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, completed, canceled, failed, needs_review] }
        model: { type: string }
        projectId: { type: string }
        resultUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required: [id, email, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorId, action, targetType, targetId, metadata, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string }
        requestId: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Account, role, email verification, or recent authentication policy rejected the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Operation conflicts with an account safety invariant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Account dependencies are not configured or unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
