name: ai-flow
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ai_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_flow_local}
      POSTGRES_DB: ai_flow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_flow -d ai_flow"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
