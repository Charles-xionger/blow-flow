name: blow-flow
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ai_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_flow_local}
      POSTGRES_DB: ai_flow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_flow -d ai_flow"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-15672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  rabbitmq-data:
    name: ${RABBITMQ_VOLUME_NAME:-ai-flow_rabbitmq-data}
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-ai-flow_postgres-data}
